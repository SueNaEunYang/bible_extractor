<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 번역본 추출기</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #3f66b0;
    --accent-soft: #eaf0fb;
    --accent-text: #ffffff;
    --danger: #c0392b;
    --ok: #1f8a53;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1c2027;
      --panel-2: #21262e;
      --border: #333a44;
      --text: #e6e9ee;
      --muted: #9aa3b0;
      --accent: #6f9bea;
      --accent-soft: #253248;
      --accent-text: #10141a;
      --danger: #e57373;
      --ok: #5fce97;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .sub kbd {
    font: inherit; font-size: 12px; background: var(--panel);
    border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 5px;
  }

  .cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 940px) { .cols { grid-template-columns: 1fr 1fr; align-items: start; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 10px; min-height: 28px;
  }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }

  textarea {
    width: 100%;
    min-height: 108px;
    height: 108px;
    resize: vertical;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.55;
  }
  @media (min-width: 940px) { textarea { min-height: 140px; height: 140px; } }
  textarea:focus, button:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* buttons */
  button {
    font: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 7px 12px; transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--accent-soft); }
  .btn-primary {
    background: var(--accent); color: var(--accent-text);
    border-color: var(--accent); font-weight: 700; padding: 9px 18px;
  }
  .btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
  .btn-primary:disabled, button:disabled {
    opacity: .45; cursor: not-allowed; filter: none; background: var(--panel-2);
    color: var(--muted); border-color: var(--border); font-weight: 400;
  }
  .btn-quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; font-size: 13px; }
  .btn-quiet:hover { background: var(--panel-2); color: var(--text); }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer;
  }
  .chip:hover { background: var(--accent-soft); }
  .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-text); font-weight: 700;
  }
  .chip .count { font-size: 11.5px; opacity: .7; font-weight: 400; }
  .field-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 14px; }

  .options { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; }
  .options .chips { margin-top: 4px; }
  .opt-group { min-width: 0; }
  .opt-group .chip { font-size: 12.5px; padding: 4px 10px; }

  /* result */
  .result {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    padding: 14px;
    min-height: 220px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    line-height: 1.7;
    user-select: text;
  }
  @media (min-width: 940px) { .result { min-height: 340px; } }
  .result.empty, .result.problem { color: var(--muted); }
  .result.problem { color: var(--danger); }
  .result .hint { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 18px; }

  /* 모바일: 스크롤 없이 누르는 하단 고정 복사 바 */
  .sticky-bar {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(0,0,0,.10);
  }
  .sticky-bar button { width: 100%; padding: 13px; font-size: 16px; }
  @media (max-width: 939px) {
    .sticky-bar { display: block; }
    body { padding-bottom: 96px; }
    .panel-head #copy-btn { display: none; }
    .toast { bottom: 92px !important; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); z-index: 30;
    background: var(--text); color: var(--bg);
    padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>성경 번역본 추출기</h1>
    <p class="sub">붙여넣으면 번역본을 자동으로 찾아 정리합니다. <kbd>⌘/Ctrl</kbd> + <kbd>Enter</kbd> 로 바로 복사.</p>
  </header>

  <div class="cols">
    <!-- INPUT -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">1. 붙여넣기</span>
        <div>
          <button type="button" id="sample-btn" class="btn-quiet">예시 넣기</button>
          <button type="button" id="clear-btn" class="btn-quiet">지우기</button>
        </div>
      </div>

      <textarea id="input-text" spellcheck="false" autofocus
        placeholder="여기에 성경 구절을 붙여넣으세요.&#10;&#10;2 Samuel 23:8&#10;(New International Version) These are the names of ...&#10;(개역개정) 다윗의 용사들의 이름은 ..."></textarea>

      <div class="field-label">2. 번역본 고르기</div>
      <div class="chips" id="version-chips" role="group" aria-label="번역본 선택"></div>

      <div class="options">
        <div class="opt-group">
          <div class="field-label" style="margin-top:0">출력 형식</div>
          <div class="chips" id="format-chips" role="group" aria-label="출력 형식">
            <button type="button" class="chip" data-value="default">기본</button>
            <button type="button" class="chip" data-value="plain">본문만</button>
            <button type="button" class="chip" data-value="each">절마다 출처</button>
          </div>
        </div>
        <div class="opt-group">
          <div class="field-label" style="margin-top:0">책 이름</div>
          <div class="chips" id="book-chips" role="group" aria-label="책 이름 표기">
            <button type="button" class="chip" data-value="ko">한글</button>
            <button type="button" class="chip" data-value="raw">원문 그대로</button>
          </div>
        </div>
      </div>
    </section>

    <!-- RESULT -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">3. 결과</span>
        <button type="button" id="copy-btn" class="btn-primary" disabled>결과 복사</button>
      </div>
      <div id="result" class="result empty"></div>
      <div class="meta" id="meta"></div>
    </section>
  </div>
</div>

<div class="sticky-bar">
  <button type="button" id="copy-btn-mobile" class="btn-primary" disabled>결과 복사</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ---------- 데이터 ----------
  var BOOKS_SINGLE = {
    genesis:'창세기', exodus:'출애굽기', leviticus:'레위기', numbers:'민수기',
    deuteronomy:'신명기', joshua:'여호수아', judges:'사사기', ruth:'룻기',
    ezra:'에스라', nehemiah:'느헤미야', esther:'에스더', job:'욥기',
    psalm:'시편', psalms:'시편', proverbs:'잠언', ecclesiastes:'전도서',
    'song of solomon':'아가', 'song of songs':'아가', isaiah:'이사야',
    jeremiah:'예레미야', lamentations:'예레미야애가', ezekiel:'에스겔',
    daniel:'다니엘', hosea:'호세아', joel:'요엘', amos:'아모스',
    obadiah:'오바댜', jonah:'요나', micah:'미가', nahum:'나훔',
    habakkuk:'하박국', zephaniah:'스바냐', haggai:'학개', zechariah:'스가랴',
    malachi:'말라기', matthew:'마태복음', mark:'마가복음', luke:'누가복음',
    john:'요한복음', acts:'사도행전', romans:'로마서', galatians:'갈라디아서',
    ephesians:'에베소서', philippians:'빌립보서', colossians:'골로새서',
    titus:'디도서', philemon:'빌레몬서', hebrews:'히브리서', james:'야고보서',
    jude:'유다서', revelation:'요한계시록', revelations:'요한계시록'
  };
  // 앞에 숫자가 붙는 책 (1 Samuel 등)
  var BOOKS_ORDINAL = {
    samuel:['사무엘상','사무엘하'],
    kings:['열왕기상','열왕기하'],
    chronicles:['역대상','역대하'],
    corinthians:['고린도전서','고린도후서'],
    thessalonians:['데살로니가전서','데살로니가후서'],
    timothy:['디모데전서','디모데후서'],
    peter:['베드로전서','베드로후서'],
    john:['요한일서','요한이서','요한삼서']
  };
  var VERSION_ABBR = {
    'newinternationalversion':'NIV', 'kingjamesversion':'KJV',
    'newkingjamesversion':'NKJV', 'newlivingtranslation':'NLT',
    'englishstandardversion':'ESV', 'newamericanstandardbible':'NASB',
    'christianstandardbible':'CSB', 'goodnewstranslation':'GNT',
    'contemporaryenglishversion':'CEV', 'amplifiedbible':'AMP',
    'themessage':'MSG', 'messagebible':'MSG', 'revisedstandardversion':'RSV',
    'newrevisedstandardversion':'NRSV'
  };
  var ROMAN = { i:'1', ii:'2', iii:'3' };

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var inputText = $('input-text'),
      versionChips = $('version-chips'),
      formatChips = $('format-chips'),
      bookChips = $('book-chips'),
      resultEl = $('result'),
      metaEl = $('meta'),
      copyBtn = $('copy-btn'),
      copyBtnMobile = $('copy-btn-mobile'),
      clearBtn = $('clear-btn'),
      sampleBtn = $('sample-btn'),
      toastEl = $('toast');

  var state = {
    versionKey: null,          // 선택된 번역본 정규화 키
    format: load('fmt', 'default'),
    bookStyle: load('book', 'ko'),
    parsed: { verses: [], versions: [] },
    output: ''
  };

  function load(k, d) {
    try { return localStorage.getItem('bve.' + k) || d; } catch (e) { return d; }
  }
  function save(k, v) { try { localStorage.setItem('bve.' + k, v); } catch (e) {} }

  // ---------- 파싱 ----------
  function normKey(s) { return s.toLowerCase().replace(/[\s.·・]/g, ''); }

  // 줄 맨 앞의 (...) 를 괄호 짝 맞춰서 떼어낸다. "(Message Bible (MSG)) 본문" 대응
  function splitLeadingParen(line) {
    if (line.charAt(0) !== '(') return null;
    var depth = 0;
    for (var i = 0; i < line.length; i++) {
      var c = line.charAt(i);
      if (c === '(') depth++;
      else if (c === ')') {
        depth--;
        if (depth === 0) {
          return { label: line.slice(1, i).trim(), rest: line.slice(i + 1).trim() };
        }
      }
    }
    return null;
  }

  // "2 Samuel 23:8", "사무엘하 23:8", "Psalm 23:1-3"
  var REF_RE = /^\s*((?:[1-3]|I{1,3})?\s*[A-Za-z가-힣][A-Za-z가-힣\s]*?)\s*(\d+)\s*:\s*(\d+)(?:\s*[-–~]\s*(\d+))?\s*$/;

  function parse(text) {
    var lines = text.split(/\r?\n/);
    var verses = [], versionMap = {}, cur = null, lastEntry = null;

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) { lastEntry = null; continue; }

      var ref = REF_RE.exec(line);
      if (ref) {
        cur = {
          book: ref[1].trim(),
          chapter: ref[2],
          verse: parseInt(ref[3], 10),
          verseEnd: ref[4] ? parseInt(ref[4], 10) : null
        };
        lastEntry = null;
        continue;
      }

      var p = splitLeadingParen(line);
      if (p && p.label) {
        var key = normKey(p.label);
        if (!versionMap[key]) versionMap[key] = { key: key, label: p.label, count: 0 };
        versionMap[key].count++;
        if (cur && p.rest) {
          lastEntry = {
            versionKey: key,
            book: cur.book, chapter: cur.chapter,
            verse: cur.verse, verseEnd: cur.verseEnd,
            text: p.rest
          };
          verses.push(lastEntry);
        } else {
          lastEntry = null;
        }
        continue;
      }

      // 참조도 번역본 표시도 아니면 앞 구절이 줄바꿈된 것으로 본다
      if (lastEntry) lastEntry.text += ' ' + line;
    }

    var versions = Object.keys(versionMap).map(function (k) { return versionMap[k]; });
    versions.sort(function (a, b) { return b.count - a.count; });
    return { verses: verses, versions: versions };
  }

  // ---------- 표기 변환 ----------
  function bookToKorean(raw) {
    var s = raw.trim().replace(/\s+/g, ' ');
    if (/[가-힣]/.test(s)) return s;                      // 이미 한글

    var m = /^(?:([1-3])\s*|(I{1,3})\s+)(.+)$/i.exec(s);
    var ord = '';
    var name = s.toLowerCase().trim();
    if (m) {
      var rawOrd = m[1] || m[2];
      ord = ROMAN[rawOrd.toLowerCase()] || rawOrd;
      name = m[3].toLowerCase().trim();
    }

    if (ord && BOOKS_ORDINAL[name]) {
      var arr = BOOKS_ORDINAL[name];
      return arr[parseInt(ord, 10) - 1] || arr[arr.length - 1];
    }
    if (BOOKS_SINGLE[name]) return BOOKS_SINGLE[name];

    // 축약 입력(Gen, Ps, Rom …) 대응
    var pool = ord ? BOOKS_ORDINAL : BOOKS_SINGLE;
    for (var k in pool) {
      if (k.indexOf(name) === 0 && name.length >= 2) {
        return ord ? (pool[k][parseInt(ord, 10) - 1] || pool[k][pool[k].length - 1]) : pool[k];
      }
    }
    return s; // 모르면 원문 유지
  }

  function bookName(raw) {
    return state.bookStyle === 'ko' ? bookToKorean(raw) : raw.trim().replace(/\s+/g, ' ');
  }

  function versionDisplay(label) {
    var inner = /\(([^()]+)\)\s*$/.exec(label);           // "Message Bible (MSG)" → MSG
    if (inner) return inner[1].trim();
    var abbr = VERSION_ABBR[normKey(label)];
    return abbr || label.replace(/\s+/g, ' ').trim();
  }

  // 8,9,10,12 → "8-10, 12"
  function verseRangeLabel(list) {
    var nums = [], seen = {};
    list.forEach(function (v) {
      for (var n = v.verse; n <= (v.verseEnd || v.verse); n++) {
        if (!seen[n]) { seen[n] = 1; nums.push(n); }
      }
    });
    nums.sort(function (a, b) { return a - b; });
    var parts = [], start = null, prev = null;
    nums.forEach(function (n) {
      if (start === null) { start = prev = n; return; }
      if (n === prev + 1) { prev = n; return; }
      parts.push(start === prev ? String(start) : start + '-' + prev);
      start = prev = n;
    });
    if (start !== null) parts.push(start === prev ? String(start) : start + '-' + prev);
    return parts.join(', ');
  }

  function verseNo(v) { return v.verseEnd ? v.verse + '-' + v.verseEnd : String(v.verse); }

  // ---------- 결과 만들기 ----------
  function build() {
    var version = null;
    for (var i = 0; i < state.parsed.versions.length; i++) {
      if (state.parsed.versions[i].key === state.versionKey) version = state.parsed.versions[i];
    }
    if (!version) return { text: '', count: 0 };

    var picked = state.parsed.verses.filter(function (v) { return v.versionKey === state.versionKey; });
    if (!picked.length) return { text: '', count: 0 };

    var vName = versionDisplay(version.label);

    if (state.format === 'plain') {
      return { text: picked.map(function (v) { return v.text; }).join('\n'), count: picked.length };
    }
    if (state.format === 'each') {
      return {
        text: picked.map(function (v) {
          return '[' + bookName(v.book) + ' ' + v.chapter + ':' + verseNo(v) + ', ' + vName + '] ' + v.text;
        }).join('\n\n'),
        count: picked.length
      };
    }

    // 기본: 책·장이 같은 구절끼리 묶고, 묶음마다 머리말
    var groups = [], last = null;
    picked.forEach(function (v) {
      var id = bookName(v.book) + '|' + v.chapter;
      if (!last || last.id !== id) { last = { id: id, book: bookName(v.book), chapter: v.chapter, items: [] }; groups.push(last); }
      last.items.push(v);
    });

    var blocks = groups.map(function (g) {
      var head = '[' + g.book + ' ' + g.chapter + ':' + verseRangeLabel(g.items) + ', ' + vName + ']';
      if (g.items.length === 1) return head + ' ' + g.items[0].text;
      return head + '\n' + g.items.map(function (v) { return verseNo(v) + ' ' + v.text; }).join('\n');
    });

    return { text: blocks.join('\n\n'), count: picked.length };
  }

  // ---------- 렌더 ----------
  function renderVersionChips() {
    var vs = state.parsed.versions;
    versionChips.innerHTML = '';

    if (!vs.length) {
      var span = document.createElement('span');
      span.style.cssText = 'font-size:13px;color:var(--muted)';
      span.textContent = inputText.value.trim()
        ? '번역본 표시를 찾지 못했습니다. 각 구절이 "(개역개정) 본문" 형태인지 확인해 보세요.'
        : '붙여넣으면 여기에 번역본이 나타납니다.';
      versionChips.appendChild(span);
      return;
    }

    // 이전 선택 유지 → 없으면 마지막에 쓴 번역본 → 없으면 가장 많이 나온 것
    var keys = vs.map(function (v) { return v.key; });
    if (keys.indexOf(state.versionKey) === -1) {
      var remembered = load('ver', '');
      state.versionKey = keys.indexOf(remembered) !== -1 ? remembered : vs[0].key;
    }

    vs.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('aria-pressed', String(v.key === state.versionKey));
      b.innerHTML = '<span></span><span class="count"></span>';
      b.firstChild.textContent = versionDisplay(v.label);
      b.lastChild.textContent = v.count + '절';
      b.addEventListener('click', function () {
        state.versionKey = v.key;
        save('ver', v.key);
        renderVersionChips();
        renderResult();
      });
      versionChips.appendChild(b);
    });
  }

  function renderToggle(container, value) {
    Array.prototype.forEach.call(container.querySelectorAll('.chip'), function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.value === value));
    });
  }

  function setCopyEnabled(count) {
    copyBtn.disabled = !count;
    copyBtnMobile.disabled = !count;
    copyBtnMobile.textContent = count ? '결과 복사 (' + count + '절)' : '결과 복사';
  }

  function renderResult() {
    var out = build();
    state.output = out.text;
    resultEl.classList.remove('empty', 'problem');

    if (!inputText.value.trim()) {
      resultEl.classList.add('empty');
      resultEl.textContent = '위에 성경 구절을 붙여넣으세요.';
      metaEl.textContent = '';
      setCopyEnabled(0);
      return;
    }
    if (!out.text) {
      resultEl.classList.add('problem');
      resultEl.textContent = state.parsed.versions.length
        ? '선택한 번역본에서 가져올 구절이 없습니다.'
        : '구절을 찾지 못했습니다. "요한복음 3:16" 같은 장절 줄과 "(개역개정) 본문" 줄이 필요합니다.';
      metaEl.textContent = '';
      setCopyEnabled(0);
      return;
    }

    resultEl.textContent = out.text;
    metaEl.textContent = out.count + '절 · ' + out.text.length + '자';
    setCopyEnabled(out.count);
  }

  function refresh() {
    state.parsed = parse(inputText.value);
    renderVersionChips();
    renderResult();
  }

  // ---------- 동작 ----------
  var timer = null;
  inputText.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(refresh, 120);
  });

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function copyResult() {
    if (!state.output) return;
    var done = function () { toast('복사했습니다'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(state.output).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = state.output;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { toast('복사에 실패했습니다. 결과를 직접 선택해 주세요.'); }
      document.body.removeChild(ta);
    }
  }

  copyBtn.addEventListener('click', copyResult);
  copyBtnMobile.addEventListener('click', copyResult);

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      copyResult();
    }
  });

  formatChips.addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    state.format = c.dataset.value;
    save('fmt', state.format);
    renderToggle(formatChips, state.format);
    renderResult();
  });

  bookChips.addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    state.bookStyle = c.dataset.value;
    save('book', state.bookStyle);
    renderToggle(bookChips, state.bookStyle);
    renderResult();
  });

  clearBtn.addEventListener('click', function () {
    inputText.value = '';
    inputText.focus();
    refresh();
  });

  var SAMPLE =
'2 Samuel 23:8\n' +
'(New International Version) These are the names of David’s mighty warriors: Josheb-Basshebeth, a Tahkemonite, was chief of the Three.\n' +
'(Message Bible (MSG)) This is the listing of David’s top men. Josheb-Basshebeth, the Tahkemonite. He was chief of the Three.\n' +
'(개역개정) 다윗의 용사들의 이름은 이러하니라 다그몬 사람 요셉밧세벳이라고도 하고 에센 사람 아디노라고도 하는 자는 군지휘관의 두목이라\n' +
'2 Samuel 23:9\n' +
'(New International Version) Next to him was Eleazar son of Dodai the Ahohite, one of the three mighty warriors.\n' +
'(Message Bible (MSG)) Eleazar son of Dodai the Ahohite was the next of the elite Three.\n' +
'(개역개정) 그 다음은 아호아 사람 도대의 아들 엘르아살이니 다윗과 함께 한 세 용사 중의 한 사람이라';

  sampleBtn.addEventListener('click', function () {
    inputText.value = SAMPLE;
    refresh();
    inputText.focus();
  });

  // ---------- 시작 ----------
  renderToggle(formatChips, state.format);
  renderToggle(bookChips, state.bookStyle);
  refresh();
})();
</script>
</body>
</html>
